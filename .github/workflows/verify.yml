name: Verify

on:
  push:
    branches:
      - main
    paths:
      - data/**
      - tasks/**
      - .github/workflows/verify-data.yml
  pull_request:
    paths:
      - data/**
      - tasks/**
      - .github/workflows/verify-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake addressing:verify
